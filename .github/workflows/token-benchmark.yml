# Measures the tokens, cost and time Claude Code spends on the tasks of a programme under each profile
# (benchmark/Invoke-TokenBenchmark.ps1):
#   tool    questions about this kit's own code (benchmark/token-benchmark.json)
#   game    the pilot: five tasks on a small Godot game graded by its tests (benchmark/game-benchmark.json)
#   staged  the staged game programme (benchmark/game-programme.json, benchmark/PLAN.md): genres x stages x languages,
#           chosen by a tier (min, mid, max) and narrowed by genre, stage and language
# Manual only: each run calls the model. Authenticates with a Claude subscription, not an API key: the repository secret
# CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (the same one the Evals workflow uses). Runs count against that plan's
# usage, meant for ordinary individual use. The cost columns are Claude Code's own figure, not a charge on the plan.
#
# `isolate` (on by default) runs every session as a user made for the run that can read only its game copy, not this
# checkout with its hidden tests and graders (benchmark/Isolation.ps1); the runner's passwordless sudo makes the user.
#
# `configurations: all` runs every configuration of the programme (Sonnet and Haiku, with and without the plugin) as
# parallel jobs; the plan job checks the whole run's estimate against the tier's ceiling first, so nothing is spent on a
# run that is over it.
#
# `continue_run` finishes an earlier run that did not complete (a usage limit, the job time limit, a cut-off): the id of
# an earlier Token benchmark run of this repository (empty for none). Every job downloads that run's
# `token-benchmark-<programme>-*` artifacts (kept 30 days) and runs only the sessions that have no result there that ran
# (`-SkipDone`: tokens spent and not an infrastructure failure; the others run again), then shards what is left, so the plan
# job's estimate and the parts count only the remainder. Give the same selection (programme, tier, model, plugin, repeat,
# profiles, tasks) as the run being continued. The results are a new run of their own, never a change to the old one; the
# classes need both runs' results together.
#
# `max_minutes` (285, under the job's 330 less 45 minutes for a milestone session; empty or 0 mean that cap) stops a job from starting new sessions after that long: the session running
# finishes, the results and `not-reached.json` (the sessions left) are uploaded as usual and the job ends green, with a
# notice. Continue that run with `continue_run` for the rest. A tool-programme job (120 minutes) stops 45 minutes short of
# its limit if this is more.
#
# `calibrate` runs no benchmark: it calibrates the judge (benchmark/PLAN.md, section 3). For every set of the owner's
# blind verdicts in benchmark/calibration it downloads that staged run's results and rebuilds the pairs judged on the
# review page (checked against the answer key's hash); each candidate judge, cheapest first by cost-model.json (or the
# `model` input), judges every set's pairs both ways (`votes` times in each order, the majority deciding). The first
# that meets the owner's rule of 2026-10-26 over the pooled sets is the judge, and the job stops there: it agrees with
# the owner at least as often as the owner agreed with themselves on a blind re-judge (the re-judge files there), and
# with itself on at least 90% of the pairs (benchmark/Get-JudgeAgreement.ps1 -Calibration). A set's run keeps its
# results for 30 days; after that the set can no longer be judged again.
name: Token benchmark

on:
  workflow_dispatch:
    inputs:
      programme:
        description: Which programme to run
        type: choice
        options: [tool, game, staged]
        default: tool
      configurations:
        description: One configuration (the model and plugin inputs) or all of the programme's
        type: choice
        options: [one, all]
        default: one
      model:
        description: Model alias or id, for one configuration (empty for the spec's)
        default: ''
      plugin:
        description: Load this repository as a Claude Code plugin, for one configuration
        type: boolean
        default: false
      tier:
        description: Staged programme only, min, mid (the standard programme) or max
        default: ''
      genre:
        description: Staged only, comma-separated genres (empty for the tier's)
        default: ''
      stage:
        description: Staged only, comma-separated stages (empty for the tier's)
        default: ''
      language:
        description: Staged only, gdscript, csharp or both (empty for the tier's)
        default: ''
      repeat:
        description: Runs per task and profile (empty for the spec's or the tier's)
        default: ''
      profiles:
        description: Comma-separated profile ids (empty for all)
        default: ''
      tasks:
        description: Comma-separated task ids, wildcards allowed (empty for all)
        default: ''
      isolate:
        description: Run each session as a separate user that cannot read the checkout (hidden tests, graders)
        type: boolean
        default: true
      calibrate:
        description: Calibrate the judge instead, on every set of the owner's verdicts in benchmark/calibration
        type: boolean
        default: false
      votes:
        description: With calibrate, how many times the judge judges each order of a pair (the majority decides)
        default: '1'
      shards:
        description: Split each configuration into this many parallel jobs (the mid tier outlasts one job's 330 minutes)
        default: '1'
      continue_run:
        description: Id of an earlier Token benchmark run of this repository to continue, running only the sessions it did not run (empty for none)
        default: ''
      max_minutes:
        description: Stop starting new sessions after this many minutes, and upload what was measured (the job limit is 330; at most 45 minutes less, empty or 0 for that)
        default: '285'
permissions:
  contents: read

jobs:
  plan:
    if: ${{ !inputs.calibrate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # the continued run's artifacts
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      spec: ${{ steps.matrix.outputs.spec }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The sessions an earlier run already ran, so the estimate and the parts count only the others.
      - name: The continued run's results
        if: inputs.continue_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.continue_run }}
          PROGRAMME: ${{ inputs.programme }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "continue_run must be a run id (digits), got '$RUN_ID'"; exit 1; }
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p "token-benchmark-$PROGRAMME-*" -D continued \
            || { echo "The results of run $RUN_ID are gone or it has none for this programme (a run keeps them for 30 days)"; exit 1; }      # One job per configuration; with `all`, a dry run of each first: one over its share of the tier's ceiling fails
      # here, before any session runs.
      - name: Configurations and their estimated cost
        id: matrix
        shell: pwsh
        env:
          PROGRAMME: ${{ inputs.programme }}
          CONFIGURATIONS: ${{ inputs.configurations }}
          MODEL: ${{ inputs.model }}
          PLUGIN: ${{ inputs.plugin }}
          TIER: ${{ inputs.tier }}
          GENRE: ${{ inputs.genre }}
          STAGE: ${{ inputs.stage }}
          LANGUAGE: ${{ inputs.language }}
          REPEAT: ${{ inputs.repeat }}
          PROFILES: ${{ inputs.profiles }}
          TASKS: ${{ inputs.tasks }}
          SHARDS: ${{ inputs.shards }}
          CONTINUE_RUN: ${{ inputs.continue_run }}
        run: |
          $spec = switch ($env:PROGRAMME) { 'game' { 'benchmark/game-benchmark.json' } 'staged' { 'benchmark/game-programme.json' } default { 'benchmark/token-benchmark.json' } }
          $doc = Get-Content $spec -Raw | ConvertFrom-Json -AsHashtable
          $configs = if ($env:CONFIGURATIONS -eq 'all' -and $doc.Contains('programme') -and $doc.programme.Contains('configurations')) { @($doc.programme.configurations) }
            elseif ($env:CONFIGURATIONS -eq 'all') { @(@{ model = 'sonnet'; plugin = $false }, @{ model = 'sonnet'; plugin = $true }, @{ model = 'haiku'; plugin = $false }, @{ model = 'haiku'; plugin = $true }) }
            else { @(@{ model = $(if ($env:MODEL) { $env:MODEL } else { $doc.model }); plugin = ($env:PLUGIN -eq 'true') }) }
          $total = 0.0
          foreach ($c in $configs) {
            $params = @{ SpecPath = $spec; Model = $c.model; DryRun = $true; Json = $true }
            if ($c.plugin) { $params.Plugin = $true }
            foreach ($pair in @(@('TIER', 'Tier'), @('GENRE', 'Genre'), @('STAGE', 'Stage'), @('LANGUAGE', 'Language'), @('PROFILES', 'ProfileId'), @('TASKS', 'TaskId'))) {
              $value = [Environment]::GetEnvironmentVariable($pair[0]); if ($value) { $params[$pair[1]] = $value }
            }
            if ($env:REPEAT) { $params.Repeat = [int]$env:REPEAT }
            if ($env:CONTINUE_RUN) {
              # This configuration's own artifacts only (the benchmark job downloads the same ones).
              $name = "token-benchmark-$($env:PROGRAMME)-$($c.model)$(if ($c.plugin) { '-plugin' })"
              $own = @(Get-ChildItem continued -Directory | Where-Object { $_.Name -eq $name -or $_.Name -like "$name-part-*" } | ForEach-Object FullName)
              if ($own.Count) { $params.SkipDone = $own -join ',' }
            }
            $out = ./benchmark/Invoke-TokenBenchmark.ps1 @params
            if ($LASTEXITCODE) { throw "$($c.model)$(if ($c.plugin) { ' with the plugin' }): the dry run failed (over its ceiling, or a bad selection)" }
            $estimate = ($out | Select-Object -Last 1 | ConvertFrom-Json).estimateUsd
            if ($null -ne $estimate) { $total += $estimate }
          }
          "Estimated cost of the whole run$(if ($env:CONTINUE_RUN) { " (the sessions left of run $env:CONTINUE_RUN)" }): $([math]::Round($total, 2)) USD over $($configs.Count) configuration(s)" | Add-Content $env:GITHUB_STEP_SUMMARY
          # Each configuration as one job, or as n parts (Invoke-TokenBenchmark.ps1 -Shard k/n) that together are the run.
          $n = [Math]::Max(1, [int]"0$env:SHARDS")
          $jobs = @(foreach ($c in $configs) { for ($k = 1; $k -le $n; $k++) { @{ model = $c.model; plugin = [bool]$c.plugin; shard = $(if ($n -gt 1) { "$k/$n" } else { '' }); part = $(if ($n -gt 1) { "$k" } else { '' }) } } })
          "matrix=$(@{ include = $jobs } | ConvertTo-Json -Compress -Depth 4)" | Add-Content $env:GITHUB_OUTPUT
          "spec=$spec" | Add-Content $env:GITHUB_OUTPUT

  benchmark:
    needs: plan
    runs-on: ubuntu-latest
    # A game session may take 15 minutes, a milestone 45, and each is graded with Godot afterwards.
    timeout-minutes: ${{ inputs.programme == 'tool' && 120 || 330 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      actions: read   # the continued run's artifacts
    env:
      # An ANTHROPIC_API_KEY in the environment would take precedence over the token, so none is set here.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Claude Code
        shell: pwsh
        run: |
          if (-not $env:CLAUDE_CODE_OAUTH_TOKEN) { throw 'Add the CLAUDE_CODE_OAUTH_TOKEN repository secret (from claude setup-token) to run the benchmark' }
          npm install -g @anthropic-ai/claude-code@2.1.312
      - name: The continued run's results
        if: inputs.continue_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.continue_run }}
          PROGRAMME: ${{ inputs.programme }}
          MODEL: ${{ matrix.model }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "continue_run must be a run id (digits), got '$RUN_ID'"; exit 1; }
          # Only this job's own configuration: its artifact is token-benchmark-<programme>-<model>[-plugin] or, in parts, the same
          # with -part-<k>. The patterns are exact, so `sonnet` takes neither `sonnet-plugin` nor another model.
          NAME="token-benchmark-$PROGRAMME-$MODEL"; [ "$PLUGIN" = true ] && NAME="$NAME-plugin"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p "$NAME" -p "$NAME-part-*" -D continued \
            || { echo "The results of run $RUN_ID are gone or it has none for $NAME (a run keeps them for 30 days)"; exit 1; }
      # The game programmes' sessions run Godot, and their grader runs the game's tests; setup sets GODOT_BIN for both.
      # The staged programme has C# games too, so it takes the .NET build of Godot, which runs GDScript as well.
      - name: Godot for the game programmes
        if: inputs.programme != 'tool'
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 setup -Project $(if ('${{ inputs.programme }}' -eq 'staged') { 'examples/csharp/game' } else { 'examples/gdscript' })
      # One small request first: a token that is malformed or revoked fails here, by name, instead of as a run of 0 scores.
      - name: The subscription token works
        shell: pwsh
        run: |
          $token = $env:CLAUDE_CODE_OAUTH_TOKEN
          if ($token -match '\s') { Write-Host '::warning::CLAUDE_CODE_OAUTH_TOKEN contains spaces or line breaks; paste it again as one line' }
          if ($token -notmatch '^sk-ant-oat') { Write-Host '::warning::CLAUDE_CODE_OAUTH_TOKEN does not start like a claude setup-token token (sk-ant-oat...)' }
          $out = claude -p 'Reply with the single word OK.' --max-turns 1 --output-format json 2>&1
          if ($LASTEXITCODE) { throw "Claude Code rejected CLAUDE_CODE_OAUTH_TOKEN; run claude setup-token again and replace the secret: $out" }
      - name: Run the benchmark
        shell: pwsh
        env:
          SPEC: ${{ needs.plan.outputs.spec }}
          MODEL: ${{ matrix.model }}
          PLUGIN: ${{ matrix.plugin }}
          TIER: ${{ inputs.tier }}
          GENRE: ${{ inputs.genre }}
          STAGE: ${{ inputs.stage }}
          LANGUAGE: ${{ inputs.language }}
          REPEAT: ${{ inputs.repeat }}
          PROFILES: ${{ inputs.profiles }}
          TASKS: ${{ inputs.tasks }}
          ISOLATE: ${{ inputs.isolate }}
          SHARD: ${{ matrix.shard }}
          CONTINUE_RUN: ${{ inputs.continue_run }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          # The job's own time limit (below), for the margin the session in progress and the upload need.
          JOB_MINUTES: ${{ inputs.programme == 'tool' && 120 || 330 }}
        run: |
          $params = @{ SpecPath = $env:SPEC; OutputDir = 'benchmark/results'; SaveResponses = $true; Model = $env:MODEL }
          if ($env:PLUGIN -eq 'true') { $params.Plugin = $true }
          if ($env:ISOLATE -eq 'true') { $params.Isolate = $true }
          foreach ($pair in @(@('TIER', 'Tier'), @('GENRE', 'Genre'), @('STAGE', 'Stage'), @('LANGUAGE', 'Language'), @('PROFILES', 'ProfileId'), @('TASKS', 'TaskId'))) {
            $value = [Environment]::GetEnvironmentVariable($pair[0]); if ($value) { $params[$pair[1]] = $value }
          }
          if ($env:REPEAT) { $params.Repeat = [int]$env:REPEAT }
          if ($env:SHARD) { $params.Shard = $env:SHARD }
          if ($env:CONTINUE_RUN) { $params.SkipDone = (Get-ChildItem continued -Directory | ForEach-Object FullName) -join ',' }
          # Never later than 45 minutes (a milestone session) before the job's limit, whatever max_minutes says, and always set.
          $minutes = [int](./.github/scripts/Get-BenchmarkMinutes.ps1 -MaxMinutes $env:MAX_MINUTES -JobMinutes ([int]$env:JOB_MINUTES))
          $params.MaxMinutes = $minutes
          ./benchmark/Invoke-TokenBenchmark.ps1 @params
          $code = $LASTEXITCODE
          Get-ChildItem benchmark/results -Recurse -Filter summary.md | Get-Content -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
          # Exit 2 is the runner's "incomplete, nothing failed": the time limit came first. The upload follows; continue_run finishes it.
          if ($code -eq 2) { Write-Host "::notice::Stopped at the $minutes-minute limit; the sessions left are in not-reached.json. Run again with continue_run set to this run's id."; exit 0 }
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: token-benchmark-${{ inputs.programme }}-${{ matrix.model }}${{ matrix.plugin && '-plugin' || '' }}${{ matrix.part && format('-part-{0}', matrix.part) || '' }}
          path: benchmark/results/
          retention-days: 30

  calibrate:
    if: ${{ inputs.calibrate }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read   # the judged runs' artifacts
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Claude Code
        shell: pwsh
        run: |
          if (-not $env:CLAUDE_CODE_OAUTH_TOKEN) { throw 'Add the CLAUDE_CODE_OAUTH_TOKEN repository secret (from claude setup-token) to calibrate the judge' }
          npm install -g @anthropic-ai/claude-code@2.1.312
          $out = claude -p 'Reply with the single word OK.' --max-turns 1 --output-format json 2>&1
          if ($LASTEXITCODE) { throw "Claude Code rejected CLAUDE_CODE_OAUTH_TOKEN; run claude setup-token again and replace the secret: $out" }
      # Each set's pairs, rebuilt from its run and checked against the key the owner's page was made from.
      - name: The owner's pairs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sets = @(foreach ($file in @(Get-ChildItem benchmark/calibration -Filter *.json | Sort-Object Name)) {
              $cal = Get-Content $file.FullName -Raw | ConvertFrom-Json
              if (-not $cal.PSObject.Properties['verdicts']) { continue }
              $run = "$($cal.run)"
              gh run download $run -R $env:GITHUB_REPOSITORY -p 'token-benchmark-staged-*' -D "judged-run/$run" | Out-Host
              if ($LASTEXITCODE) { throw "The results of run $run ($($file.Name)) are gone: a run keeps them for 30 days" }
              $results = @(Get-ChildItem "judged-run/$run" -Directory | ForEach-Object FullName) -join ','
              $prefix = if ($cal.PSObject.Properties['idPrefix']) { $cal.idPrefix } else { 'p' }
              ./benchmark/Invoke-SideBySide.ps1 -Results $results -ReviewOut "review/$run" -ReviewIdPrefix $prefix | Out-Null
              $hash = (Get-FileHash "review/$run/review-key.json" -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $cal.keySha256) { throw "The pairs rebuilt from run $run are not the ones judged on the review page (key $hash, expected $($cal.keySha256))" }
              [ordered]@{ run = $run; results = $results; key = "review/$run/review-key.json" }
            })
          if ($sets.Count -eq 0) { throw 'No set of verdicts in benchmark/calibration' }
          ConvertTo-Json -InputObject $sets | Set-Content sets.json
      - name: The judge against the owner's rule
        shell: pwsh
        env:
          JUDGES: ${{ inputs.model }}
          VOTES: ${{ inputs.votes }}
        run: |
          $sets = @(Get-Content sets.json -Raw | ConvertFrom-Json)
          # Cheapest first: the judges cost-model.json prices, by their price per judgement.
          $candidates = if ($env:JUDGES) { @($env:JUDGES -split ',' | ForEach-Object Trim) } else {
              @((Get-Content benchmark/cost-model.json -Raw | ConvertFrom-Json).sessions | Where-Object kind -eq 'judge' | Sort-Object usd | ForEach-Object model) }
          $judge = $null
          "| Judge | Agrees with the owner | Agrees with itself | Calibrated |`n|---|---|---|---|" | Add-Content $env:GITHUB_STEP_SUMMARY
          foreach ($model in $candidates) {
            $prefs = @(foreach ($set in $sets) {
                ./benchmark/Invoke-SideBySide.ps1 -Results $set.results -Model $model -OutDir "judged/$model/$($set.run)" -Votes ([Math]::Max(1, [int]"0$env:VOTES")) | Out-Null
                if ($LASTEXITCODE) { throw "The $model judge did not finish its judgements of run $($set.run)" }
                "judged/$model/$($set.run)/preferences.json"
              })
            $out = ./benchmark/Get-JudgeAgreement.ps1 -Calibration benchmark/calibration -Key @($sets | ForEach-Object key) -Preferences $prefs -Json
            $passed = $LASTEXITCODE -eq 0
            ($out -join "`n") | Set-Content "judged/$model/agreement.json"
            $d = ($out -join "`n") | ConvertFrom-Json
            "| $($d.judgeModel) | $([math]::Round(100 * $d.agreement))% of $($d.compared) (needs $([math]::Round(100 * $d.minAgreement))%) | $([math]::Round(100 * $d.consistency))% of $($d.pairsJudged) (needs $([math]::Round(100 * $d.minConsistency))%) | $(if ($passed) { 'yes' } else { 'no' }) |" | Add-Content $env:GITHUB_STEP_SUMMARY
            if ($passed) { $judge = $d.judgeModel; break }
          }
          if (-not $judge) { throw "No candidate judge ($($candidates -join ', ')) met the owner's rule (see the table)" }
          "The judge: $judge (the bar: $($d.minAgreementSource))" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: judge-calibration
          path: judged/
          retention-days: 90
