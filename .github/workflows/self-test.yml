# Exercises the kit on every pull request (what the change needs), on every merge to main and every night (everything):
# the reusable workflow on Linux runners, and the script on Windows exactly as it runs on a developer machine.
# docs/ci.md says what runs when.
name: Self-test

on:
  # A pull request runs what its changes need (the `changes` job). Main runs everything after each merge, and so does the
  # nightly schedule, which also catches what a pull request's filter let past (it runs on the default branch).
  # Branches without a pull request are not tested: the pull request does that, so a push to its branch starts one run,
  # not two.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

# A new push to a pull request's branch cancels the run of the older commit. Everything else keeps its own run: every
# merge to main, each nightly run and each run started by hand has a group of its own (the run id), since a group lets only
# one run wait and would drop the one in between.
concurrency:
  group: self-test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# git 2.54+ runs background maintenance after a commit, which packs and deletes loose objects, and has raced tests that
# commit and then clone or copy a repository (the staged programme's game workspaces, Test-UpdatePins.ps1's clone). Off
# for every git call of every job.
env:
  GIT_CONFIG_COUNT: '3'
  GIT_CONFIG_KEY_0: gc.auto
  GIT_CONFIG_VALUE_0: '0'
  GIT_CONFIG_KEY_1: gc.autoDetach
  GIT_CONFIG_VALUE_1: 'false'
  GIT_CONFIG_KEY_2: maintenance.auto
  GIT_CONFIG_VALUE_2: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Every kit run in this job records the functions it entered and the error code it stopped with; the coverage job
      # at the end adds them up (tests/Get-KitCoverage.ps1).
      - name: Record what the kit reaches
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Pinned, like actionlint: the runner image carries whatever release was newest when it was built, and a new
          # release can add or change a default rule and turn a green branch red overnight.
          $version = '1.25.0'
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq $version)) {
            Install-PSResource PSScriptAnalyzer -Version $version -TrustRepository -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $version
          # Every tracked script, but the patterns fixture, which is bad on purpose (tests/Test-PowerShellPatterns.ps1).
          $files = @(git ls-files -- '*.ps1' | Where-Object { $_ -notlike 'tests/powershell-patterns-fixture/*' })
          if ($LASTEXITCODE -ne 0 -or $files.Count -eq 0) { throw 'git ls-files found no scripts' }
          $issues = @(foreach ($file in $files) { Invoke-ScriptAnalyzer -Path $file -Settings ci/godot/PSScriptAnalyzerSettings.psd1 })
          foreach ($i in $issues) {
            $message = $i.Message -replace '%', '%25' -replace '\r?\n', '%0A'
            Write-Host "::error file=$([IO.Path]::GetRelativePath($PWD, $i.ScriptPath)),line=$($i.Line),col=$($i.Column),title=$($i.RuleName)::$message"
          }
          Write-Host "PSScriptAnalyzer $version`: $($issues.Count) finding(s) in $($files.Count) scripts"
          if ($issues.Count) { exit 1 }
      - name: No tracked script uses a PowerShell anti-pattern the repository has dropped, and each check catches its fixture
        shell: pwsh
        run: ./tests/Test-PowerShellPatterns.ps1
      - name: Skills pass their own validator, and the validator catches broken fixtures
        shell: pwsh
        run: |
          ./ci/godot/tools/Test-Skills.ps1
          ./tests/Test-SkillFixtures.ps1
      - name: Every link and quoted path in the docs and skills leads somewhere
        shell: pwsh
        run: ./tests/Test-DocLinks.ps1
      - name: The GitHub Pages site builds from the Markdown, and every page, link, anchor and label in it checks out
        shell: pwsh
        run: ./tests/Test-Site.ps1
      - name: Every command, error code, lib file, tool, skill, subagent and workflow job has a row in docs/coverage.md
        shell: pwsh
        run: ./tests/Test-CoverageMap.ps1
      - name: doctor reports LFS pointers, committed keys, Windows-reserved names, case twins and res:// paths in the wrong case
        shell: pwsh
        run: ./tests/Test-RepoHygiene.ps1
      - name: doctor reports agent instructions that name kit flags or files that do not exist; the kit's own calls bind
        shell: pwsh
        run: ./tests/Test-Context.ps1
      - name: Changelog fragments are grouped, sorted and assembled into CHANGELOG.md; bad ones are refused by name
        shell: pwsh
        run: ./tests/Test-Changelog.ps1
      - name: telemetry reads the run history - pass rate, mean, median, p95, trend, hot spots, flaky tests - and says so when it is thin or missing
        shell: pwsh
        run: ./tests/Test-Telemetry.ps1
      - name: The release notes are the changelog section of exactly that version
        shell: pwsh
        run: ./tests/Test-ReleaseNotes.ps1
      - name: The workflows hold what cannot be run here - a pull request's own concurrency group, a release that cannot end green without exports, the canary's upstream code with no write token, whole-string version matches
        shell: pwsh
        run: ./tests/Test-WorkflowLint.ps1
      - name: The selection of what a change runs (the sample of pairs, the pairs of a changed game, everything on main) holds
        shell: pwsh
        run: ./tests/Test-SelectJobs.ps1
      - name: Each job's input hash moves with the files it reads and the runner, and the observations name what to record (stage 0 of the CI cache)
        shell: pwsh
        run: ./tests/Test-InputHash.ps1
      - name: help and /kit have an entry for every command, skill and subagent
        shell: pwsh
        run: ./tests/Test-Help.ps1
      - name: Architecture rules catch their fixtures and stay quiet on clean code
        shell: pwsh
        run: ./tests/Test-ArchitectureFixtures.ps1
      - name: doctor flags actions missing a keyboard or gamepad binding
        shell: pwsh
        run: |
          # The fixture's project.godot was written by Godot: jump has both, dash only a key, aim only a stick, and only
          # ui_accept was given a gamepad button.
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 doctor -Json -Project tests/doctor-fixture 2>$null | ConvertFrom-Json
          $messages = @($d.checks | ForEach-Object message)
          if (-not ($messages -match 'no gamepad binding: dash$')) { throw "dash: $($messages -join ' | ')" }
          if (-not ($messages -match 'no keyboard or mouse binding: aim$')) { throw "aim: $($messages -join ' | ')" }
          if (-not ($messages -match 'ui_cancel has no gamepad button') -or ($messages -match 'ui_accept')) { throw "menus: $($messages -join ' | ')" }
          if ($messages -match 'jump') { throw "jump has both bindings: $($messages -join ' | ')" }
          if (-not ($messages -match '^Sentry starts before the player is asked \(auto_init\); attaches the whole Godot log')) { throw "sentry defaults: $($messages -join ' | ')" }
          if (-not ($messages -match "^application/config/version is '1\.2\.3-rc\.1\+g1a2b3c'")) { throw "version: $($messages -join ' | ')" }
          # narrator.gd calls tts_speak with audio/general/text_to_speech at its default (off); turning it on clears the warning.
          if (-not ($messages -match 'audio/general/text_to_speech is off, so the first line is late or lost: res://narrator\.gd$')) { throw "tts off: $($messages -join ' | ')" }
          # accessibility_support=2 is Disabled, so screen readers get nothing; the copy below sets it back to Auto (0).
          if (-not ($messages -match '^Screen readers cannot read the game: accessibility_support is Disabled$')) { throw "screen reader off: $($messages -join ' | ')" }
          $copy = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'doctor-tts-on')
          Copy-Item tests/doctor-fixture/* $copy
          $godotFile = Join-Path $copy 'project.godot'
          Set-Content $godotFile ((Get-Content $godotFile -Raw).Replace('accessibility_support=2', 'accessibility_support=0')) -NoNewline
          Add-Content $godotFile "`n[audio]`n`ngeneral/text_to_speech=true"
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 doctor -Json -Project $copy 2>$null | ConvertFrom-Json
          $messages = @($d.checks | ForEach-Object message)
          if ($messages -match 'text_to_speech is off' -or -not ($messages -match '^Text-to-speech: started at launch')) { throw "tts on: $($messages -join ' | ')" }
          if ($messages -match '^Screen readers') { throw "screen reader on Auto: $($messages -join ' | ')" }
      - name: A failed Godot download stops with download-failed
        shell: pwsh
        run: ./tests/Test-DownloadFailed.ps1
      - name: Two installs of one Godot take turns
        shell: pwsh
        run: ./tests/Test-InstallLock.ps1
      - name: A hung program is stopped after the time limit
        shell: pwsh
        run: ./tests/Test-ProcessTimeout.ps1
      - name: A crashed import or export is repeated, a failure or a hang is not
        shell: pwsh
        run: ./tests/Test-CrashRetry.ps1
      - name: Test failures are compared with the last run of the same scope (new, still failing, fixed)
        shell: pwsh
        run: ./tests/Test-FailureDelta.ps1
      - name: gdUnit4 tests that were found but never ran fail the dotnet runner
        shell: pwsh
        run: ./tests/Test-TestsNotRun.ps1
      - name: Two dotnet test runs at once under one TMPDIR each reach their own Godot
        shell: pwsh
        run: ./tests/Test-DotnetTempDir.ps1
      - name: The eval graders that need no model agree with real sessions from past Evals runs
        shell: pwsh
        run: ./tests/Test-EvalGraders.ps1
      - name: doctor checks every asset has a source and a licence
        shell: pwsh
        run: ./tests/Test-AssetManifest.ps1
      - name: The data runner checks tables against data.json
        shell: pwsh
        run: ./tests/Test-Data.ps1
      - name: The plan's vertical-slice gates (tech debt automatic, frame budget manual), the gates the skill names, and the release timeline
        shell: pwsh
        run: ./tests/Test-Plan.ps1
      - name: State from before the Hyperdot rename moves once (history, GUT stamp, tools folder, workflow, plugin entry)
        shell: pwsh
        run: ./tests/Test-OldState.ps1
      # Nightly and on main only: it has not failed in the sampled runs (docs/ci.md), takes about 3 minutes, and only
      # plan -Do sync reaches this code.
      - name: plan -Do sync against a stand-in Trello (cards, moves, archived cards, list names, credentials kept out of output)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./tests/Test-TrelloSync.ps1
      - name: doctor's GDExtension, Steam package and Steamworks file checks (rich presence, achievements, build scripts), and Steam detection
        shell: pwsh
        run: ./tests/Test-Steam.ps1
      - name: doctor picks each GDExtension library as Godot does, and reports add-on mistakes
        shell: pwsh
        run: ./tests/Test-Addons.ps1
      - name: doctor reports copies of one file, occluders with occlusion culling off and bodies moved without physics interpolation, and keeps quiet once fixed
        shell: pwsh
        run: ./tests/Test-DoctorFixture.ps1
      # The store step's trailer checks read videos with ffprobe.
      - uses: ./.github/actions/apt
        with:
          packages: ffmpeg
      - name: doctor checks Steam store art, the short description, trailers (with ffprobe), tags and the privacy policy
        shell: pwsh
        run: ./tests/Test-Store.ps1
      - name: doctor checks Web and Android presets and export paths inside the project
        shell: pwsh
        run: ./tests/Test-Platforms.ps1
      - name: The token benchmark counts, checks and retries (against a stand-in CLI)
        shell: pwsh
        run: ./tests/Test-TokenBenchmark.ps1
      - name: sfx makes bfxr's sounds from a seed, as WAV and .bfxr
        shell: pwsh
        run: ./tests/Test-Sfx.ps1
      - name: playtest counts sessions per level and draws heat maps, alone and over a screenshot
        shell: pwsh
        run: ./tests/Test-Playtest.ps1
      - name: export -GameVersion auto reads git's tags, refuses shallow clones, and setup names the macOS build
        shell: pwsh
        run: ./tests/Test-GameVersion.ps1
      - name: The juice check matches events with their feedback
        shell: pwsh
        run: ./tests/Test-JuiceLog.ps1
      - name: status measures how long passing test runs take
        shell: pwsh
        run: ./tests/Test-TestDuration.ps1
      - name: status -Handoff keeps the newest 200 subagent handoffs, and status reads them back
        shell: pwsh
        run: ./tests/Test-Handoffs.ps1
      - name: The version line and solution_directory keep a $ in their value
        shell: pwsh
        run: ./tests/Test-KitPaths.ps1 -NoGodot
      - name: No function in ci/godot is defined twice or named like a built-in alias
        shell: pwsh
        run: ./tests/Test-LibNames.ps1
      - name: bench and audio refuse several scenes before any setup
        shell: pwsh
        run: ./tests/Test-SceneCount.ps1
      - name: Version updates rewrite every pin, fail on a missing one and keep the skills valid
        shell: pwsh
        run: ./tests/Test-UpdatePins.ps1
      - name: The GitLab CI template parses, uses GitLab's keywords and reports the files the kit writes
        shell: pwsh
        run: ./tests/Test-GitLabTemplate.ps1
      - name: The PR comment finds its summary past the first 100 comments
        shell: pwsh
        run: ./tests/Test-PrComment.ps1
      - name: detect finds the solution that lists the project, in and out of git
        shell: pwsh
        run: ./tests/Test-Detect.ps1
      - name: Replacing an add-on works in paths with brackets
        shell: pwsh
        run: ./tests/Test-InstallAddon.ps1
      - name: The Stop hook blocks on changes no full passing test run has seen
        shell: pwsh
        run: ./tests/Test-StopGate.ps1
      - name: The label's index, classes, minimum, verification and rescaling
        shell: pwsh
        run: ./tests/Test-HyperdotLabel.ps1
      - name: The blind review's pairs name no plugin side, and the judge's agreement with a person and with itself is scored
        shell: pwsh
        run: ./tests/Test-ReviewPairs.ps1
      - name: status reads the GDD, tagged tests and plan links
        shell: pwsh
        run: |
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 status -Json -Project examples/csharp/game 2>$null | ConvertFrom-Json
          $f2 = $d.features | Where-Object id -eq 'F2'
          if (-not $d.ok -or $d.gdd.featureCount -ne 5 -or $f2.taggedTests.Count -ne 4 -or $f2.priority -ne 'must') { throw "status: $($d | ConvertTo-Json -Depth 6)" }
          if (($f2.fun -join ',') -ne 'challenge,sensation' -or ($d.warnings -match 'kind of fun')) { throw "Fun lines: $($f2.fun) / $($d.warnings)" }
          if ($d.inventory.mainScene -ne 'res://Main.tscn' -or $null -ne $d.plan) { throw "status inventory or plan: $($d | ConvertTo-Json -Depth 6)" }
          # In a game of its own: a plan task linked to a feature and a card, and the warnings that follow.
          $game = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'status-game')
          git ls-files examples/csharp | tar -cf - -T - | tar -x -C $game
          $root = Join-Path $game 'examples/csharp'
          git -C $root init -q
          $project = Join-Path $root 'game'
          $ci = './ci/godot/hyperdot.ps1'
          pwsh -NoProfile -File $ci plan -Do init -Project $project 2>$null | Out-Null
          if ($LASTEXITCODE) { throw "plan -Do init failed ($LASTEXITCODE)" }
          pwsh -NoProfile -File $ci plan -Do add -Title 'Title screen' -Feature F5 -Project $project 2>$null | Out-Null
          if ($LASTEXITCODE) { throw "plan -Do add failed ($LASTEXITCODE)" }
          $p = pwsh -NoProfile -File $ci plan -Do link -Id t1 -Card 5f0c1a2b3c4d5e6f7a8b9c0d -Column todo -Json -Project $project 2>$null | ConvertFrom-Json
          if ($p.tasks[0].feature -ne 'F5' -or $p.tasks[0].cardId -ne '5f0c1a2b3c4d5e6f7a8b9c0d' -or $p.tasks[0].boardColumn -ne 'todo') { throw "plan link: $($p | ConvertTo-Json -Depth 6)" }
          $bad = pwsh -NoProfile -File $ci plan -Do add -Title x -Feature 7 -Json -Project $project 2>$null | ConvertFrom-Json
          if ($bad.error.code -ne 'invalid-arguments') { throw 'a feature id must look like F3' }
          $d = pwsh -NoProfile -File $ci status -Json -Project $project 2>$null | ConvertFrom-Json
          if (($d.features | Where-Object id -eq 'F5').tasks[0].id -ne 't1') { throw "the task should show under F5: $($d | ConvertTo-Json -Depth 6)" }
          if (-not ($d.warnings -match 'F1 Paddle and ball has no plan task')) { throw "expected a missing-task warning: $($d.warnings)" }
          # A must feature that names no kind of fun, and one that names an unknown kind, are both warned about.
          $gdd = Join-Path $project 'docs/GDD.md'
          (Get-Content $gdd -Raw).Replace('Fun: challenge, sensation', 'Fun: greed').Replace("Fun: challenge`n", '') | Set-Content $gdd -NoNewline
          $d = pwsh -NoProfile -File $ci status -Json -Project $project 2>$null | ConvertFrom-Json
          if (-not ($d.warnings -match "F3 Lives and game over does not say which kind of fun") -or -not ($d.warnings -match "'greed' is not a kind of fun")) { throw "expected Fun warnings: $($d.warnings)" }
          # The deliberately invalid -Feature above set a non-zero exit code; GitHub's pwsh wrapper exits with $LASTEXITCODE.
          exit 0
      - name: Parse action manifests
        # actionlint covers workflows only; make sure every composite action is valid YAML.
        run: |
          for f in .github/actions/*/action.yml; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
            echo "ok $f"
          done
      - name: actionlint
        run: |
          # Pinned: an unpinned linter can turn a green branch red overnight.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Keep what this job's kit runs reached
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lint
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 14

  # No inputs at all: detects the shallowest project (examples/gdscript), installs GUT, runs validate,
  # gut and smoke.
  zero-config:
    needs: changes
    if: needs.changes.outputs.zero-config == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/godot.yml
    with:
      kit-coverage: coverage-zero-config

  # C# project: every detected runner, a coverage minimum, the Windows export launched on a Windows
  # runner, and a release dry run on branches. Never on a tag: a release there would publish the example game as the
  # kit's own release (or add its zips to it), so the job also gets no write access to contents.
  csharp:
    needs: changes
    if: needs.changes.outputs.csharp == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/godot.yml
    with:
      project: examples/csharp/game
      min-coverage: 40
      exports: all
      run-exports: true
      release: ${{ github.ref_type != 'tag' }}
      retention-days: 3
      kit-coverage: coverage-csharp

  # Runners picked by hand.
  explicit-runners:
    needs: changes
    if: needs.changes.outputs.explicit-runners == 'true'
    uses: ./.github/workflows/godot.yml
    with:
      project: examples/csharp/game
      runners: gdunit4,gut
      # The csharp job posts the PR comment; this job has no pull-requests: write and would only warn trying to edit it.
      pr-comment: false
      kit-coverage: coverage-explicit-runners

  # init on a bare game (no tests, no CI), then doctor and a full test run of what it generated.
  init:
    needs: changes
    if: needs.changes.outputs.init == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Every kit run in this job records the functions it entered and the error code it stopped with; the coverage job
      # at the end adds them up (tests/Get-KitCoverage.ps1).
      - name: Record what the kit reaches
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'
      - shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP 'bare-game'
          New-Item -ItemType Directory $game | Out-Null
          Copy-Item examples/gdscript/project.godot, examples/gdscript/main.gd, examples/gdscript/main.tscn, examples/gdscript/score.gd $game
          git -C $game init -q
          # A failed command only sets $LASTEXITCODE; the step would carry on to the next one.
          ./ci/godot/hyperdot.ps1 init -Project $game
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./ci/godot/hyperdot.ps1 doctor -Project $game
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./ci/godot/hyperdot.ps1 test -Project $game -Results (Join-Path $game 'test-results')
      - name: The kit inside a game stays out of it
        shell: pwsh
        run: |
          # A submodule layout: the kit, as committed, in a folder of the game. Its .gdignore files must hide it from Godot
          # and from detection, so only the game's own files are seen.
          $game = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'game-with-kit')
          Copy-Item examples/gdscript/project.godot, examples/gdscript/main.gd, examples/gdscript/main.tscn, examples/gdscript/score.gd $game
          New-Item -ItemType Directory (Join-Path $game 'tools/kit') | Out-Null
          git archive HEAD | tar -x -C (Join-Path $game 'tools/kit')
          $kit = Join-Path $game 'tools/kit/ci/godot/hyperdot.ps1'
          $d = pwsh -NoProfile -File $kit detect -Json -Project $game 2>$null | ConvertFrom-Json
          if (($d.runners -join ',') -ne 'validate,architecture,smoke') { throw "the kit's own examples leaked into detection: $($d.runners -join ',')" }
          $d = pwsh -NoProfile -File $kit test -Json -Project $game -Runners validate -Results (Join-Path $game 'r') 2>$null | ConvertFrom-Json
          if (-not $d.ok -or $d.runnerResults[0].total -ne 3) { throw "validate should load only the game's 3 files: $($d | ConvertTo-Json -Depth 6)" }
      - name: validate compiles every shader, used or not
        shell: pwsh
        run: |
          $game = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'shader-game')
          Set-Content (Join-Path $game 'project.godot') "config_version=5`n[application]`nconfig/name=`"Shaders`""
          Set-Content (Join-Path $game 'good.gdshader') "shader_type canvas_item;`nvoid fragment() {`n`tCOLOR.rgb = vec3(1.0);`n}"
          Set-Content (Join-Path $game 'bad.gdshader') "shader_type canvas_item;`nvoid fragment() {`n`tCOLOR = vec4(undefined_thing, 1.0);`n}"
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 test -Json -Project $game -Runners validate -Results (Join-Path $game 'r') 2>$null | ConvertFrom-Json
          $failed = @($d.runnerResults[0].failures | ForEach-Object name)
          # Godot may also report the broken shader once at startup; the good one must never be named.
          if ($d.ok -or 'validate.res://bad.gdshader' -notin $failed -or ($failed -match 'good')) { throw "bad.gdshader, and only it, should fail: $($d | ConvertTo-Json -Depth 6)" }
          exit 0   # the run failed on purpose
      - name: Shaders quoted in skills compile
        shell: pwsh
        run: ./tests/Test-SkillShaders.ps1
      - name: The placement checker finds an AI point off the navmesh, a torch out of reach and a blocked zip line
        shell: pwsh
        run: ./tests/Test-Placement.ps1
      - name: Bug reports are saved with their place and view and pinned on their scene in the editor
        shell: pwsh
        run: ./tests/Test-ReportPins.ps1
      - name: test -Retry reports tests that passed on a retry; quarantine.json excuses only its own test, until its date
        shell: pwsh
        run: ./tests/Test-Flaky.ps1
      # The l10n test makes its localized voice files with ffmpeg; without it the remap checks have nothing to find.
      - uses: ./.github/actions/apt
        with:
          packages: ffmpeg
      - name: The l10n runner fails duplicate, untranslated, missing and too long keys, broken remaps, mismatched voice, and text the fonts cannot draw
        shell: pwsh
        run: ./tests/Test-Localization.ps1
      - name: Error keys group a run's Godot errors across runs, and status lists the recurring ones
        shell: pwsh
        run: ./tests/Test-ErrorKeys.ps1
      - name: test refuses a -Results folder inside the project that the kit did not make
        shell: pwsh
        run: ./tests/Test-ResultsDir.ps1
      - name: Agent efficiency (-Quiet, failure details, run history, Stop hook, init -Agents / -Plugin)
        shell: pwsh
        run: |
          $game = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'quiet-game')
          Copy-Item -Recurse examples/gdscript/* $game
          git -C $game init -q
          git -C $game -c user.name=ci -c user.email=ci@example.com add -A
          git -C $game -c user.name=ci -c user.email=ci@example.com commit -qm base
          $test = Join-Path $game 'test/test_score.gd'
          (Get-Content $test -Raw).Replace('assert_eq(score.hit(10), 20)', 'assert_eq(score.hit(10), 25)') | Set-Content $test -NoNewline
          $results = Join-Path $game 'test-results'
          $errFile = Join-Path $env:RUNNER_TEMP 'quiet.err'
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 test -Json -Quiet -Project $game -Runners gut -Results $results 2>$errFile | ConvertFrom-Json
          $errBytes = (Get-Item $errFile).Length
          if ($errBytes -gt 3000) { throw "-Quiet still wrote $errBytes bytes to stderr" }
          $f = $d.runnerResults[0].failures[0]
          if ($d.ok -or $f.file -ne 'test/test_score.gd' -or $f.line -ne 7 -or $f.message -notmatch 'expected to equal \[25\]') { throw "failure detail: $($d | ConvertTo-Json -Depth 6)" }
          # The first run has nothing to compare with, so no failure claims to be new.
          if ($null -ne $d.failureDelta.comparedWith -or $null -ne $f.new) { throw "first run's failureDelta: $($d.failureDelta | ConvertTo-Json -Depth 4)" }
          if (-not (Test-Path $d.log) -or (Get-Item $d.log).Length -lt 2000) { throw "the full log should be in $($d.log)" }
          $history = @(Get-Content (Join-Path $game '.godot/hyperdot-history.jsonl') | ConvertFrom-Json)
          if ($history[-1].ok -or $history[-1].code -ne 'tests-failed') { throw "history: $($history | ConvertTo-Json)" }
          # The Stop hook blocks once while changed code has no passing run, lets a second stop through, and is quiet after a green run.
          $hook = { param($active) "{""cwd"":""$($game -replace '\\', '/')"",""stop_hook_active"":$active}" | pwsh -NoProfile -File ./hooks/stop-gate.ps1 }
          $first = & $hook 'false'
          if (($first | ConvertFrom-Json).decision -ne 'block') { throw "the Stop hook should block: $first" }
          if (& $hook 'true') { throw 'the Stop hook should let the same changes through the second time' }
          (Get-Content $test -Raw).Replace('25)', '20)') | Set-Content $test -NoNewline
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 test -Json -Quiet -Project $game -Runners gut -Results $results 2>$null | ConvertFrom-Json
          if (-not $d.ok) { throw "the fixed test should pass: $($d | ConvertTo-Json -Depth 6)" }
          if (@($d.failureDelta.fixed | ForEach-Object name) -notcontains $f.name -or @($d.failureDelta.new).Count -ne 0) { throw "the fixed test should be in failureDelta.fixed: $($d.failureDelta | ConvertTo-Json -Depth 4)" }
          if (& $hook 'false') { throw 'the Stop hook should allow stopping after a passing run' }
          # init -Agents copies the verifier with this machine's kit path; init -Plugin enables the plugin instead of copying.
          ./ci/godot/hyperdot.ps1 init -Agents -Project $game | Out-Null
          if ($LASTEXITCODE) { throw "init -Agents failed ($LASTEXITCODE)" }
          $agent = Get-Content (Join-Path $game '.claude/agents/godot-verifier.md') -Raw
          if ($agent.Contains('${CLAUDE_PLUGIN_ROOT}') -or -not $agent.Contains('ci/godot/hyperdot.ps1')) { throw 'the copied agent should name the kit path' }
          $plugged = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'plugin-game')
          Copy-Item examples/gdscript/project.godot, examples/gdscript/main.gd, examples/gdscript/main.tscn, examples/gdscript/score.gd $plugged
          ./ci/godot/hyperdot.ps1 init -Plugin -Project $plugged | Out-Null
          if ($LASTEXITCODE) { throw "init -Plugin failed ($LASTEXITCODE)" }
          $settings = Get-Content (Join-Path $plugged '.claude/settings.json') -Raw | ConvertFrom-Json -AsHashtable
          if (-not $settings.enabledPlugins['hyperdot@hyperdot'] -or (Test-Path (Join-Path $plugged '.claude/skills'))) { throw "init -Plugin: $($settings | ConvertTo-Json -Depth 5)" }
          # The failing test run above set a non-zero exit code; GitHub's pwsh wrapper exits with $LASTEXITCODE.
          exit 0
      - name: The juice runner passes timely feedback and fails late feedback
        shell: pwsh
        run: |
          $game = 'tests/juice-fixture'
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 detect -Json -Project $game 2>$null | ConvertFrom-Json
          if ('juice' -notin $d.runners) { throw "juice.json should enable the juice runner: $($d.runners -join ',')" }
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 test -Json -Quiet -Project $game -Runners juice -Results (Join-Path $env:RUNNER_TEMP 'juice-ok') 2>$null | ConvertFrom-Json
          if (-not $d.ok -or $d.runnerResults[0].total -ne 2) { throw "feedback in time: $($d | ConvertTo-Json -Depth 6)" }
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 test -Json -Quiet -Project $game -Runners juice -GameArgs '--late' -Results (Join-Path $env:RUNNER_TEMP 'juice-late') 2>$null | ConvertFrom-Json
          $f = @($d.runnerResults[0].failures)
          if ($d.ok -or $d.error.code -ne 'tests-failed' -or $f.Count -ne 1 -or $f[0].message -notmatch "had no 'flash' within 100 ms") { throw "late feedback: $($d | ConvertTo-Json -Depth 6)" }
          exit 0   # the last run failed on purpose; see the step above
      - name: Keep what this job's kit runs reached
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-init
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 14

  # bench, shot and -GameArgs. A virtual display stands in for a screen; rendering is software OpenGL, so the numbers only
  # prove the commands work, not how fast anything is.
  measure:
    needs: changes
    if: needs.changes.outputs.measure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Every kit run in this job records the functions it entered and the error code it stopped with; the coverage job
      # at the end adds them up (tests/Get-KitCoverage.ps1).
      - name: Record what the kit reaches
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'
      - name: Virtual display
        run: |
          if ! command -v Xvfb >/dev/null; then sudo apt-get update -q && sudo apt-get install -y -q xvfb; fi
          # Start Xvfb directly: xvfb-run merges stderr into stdout, which would break -Json.
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: bench, headless and with a window
        shell: pwsh
        run: |
          $ci = './ci/godot/hyperdot.ps1'
          $d = pwsh -NoProfile -File $ci bench -Json -Headless -Project examples/csharp/game -Seconds 2 -Warmup 1 -Label headless 2>$null | ConvertFrom-Json
          if (-not $d.ok -or $d.bench.display -ne 'headless' -or $d.bench.frames -lt 10) { throw "headless bench: $($d | ConvertTo-Json -Depth 5)" }
          $d = pwsh -NoProfile -File $ci bench -Json -Project examples/csharp/game -Seconds 2 -Warmup 1 -Resolution 1280x720 -Label window 2>$null | ConvertFrom-Json
          if (-not $d.ok -or $d.bench.display -eq 'headless' -or $d.bench.resolution -ne '1280x720') { throw "window bench: $($d | ConvertTo-Json -Depth 5)" }
          $d = pwsh -NoProfile -File $ci bench -Json -Headless -Project examples/csharp/game -Seconds 1 -Warmup 0 -BudgetMs 0.001 2>$null | ConvertFrom-Json
          if ($d.ok -or $d.error.code -ne 'bench-over-budget') { throw "budget gate: $($d | ConvertTo-Json -Depth 5)" }
          $rows = @(Import-Csv bench-results/bench.csv)
          if ($rows.Count -ne 3) { throw "expected 3 rows in bench.csv, got $($rows.Count)" }
          # The budget check ends with a command that fails on purpose; GitHub's pwsh wrapper exits with $LASTEXITCODE.
          exit 0
      - name: bench names the slow place (hotspots by camera position)
        shell: pwsh
        run: ./tests/Test-BenchHotspots.ps1
      - name: bench -Sweep runs once per value and marks the values over the budget
        shell: pwsh
        run: ./tests/Test-BenchSweep.ps1
      - name: shot
        shell: pwsh
        run: |
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 shot -Json -Project examples/csharp/game -Resolution 1920x1080 -Frames 30 2>$null | ConvertFrom-Json
          if (-not $d.ok -or $d.shots.Count -ne 1 -or -not (Test-Path $d.shots[0].file)) { throw "shot: $($d | ConvertTo-Json -Depth 5)" }
          # The example keeps its 4:3 arena (aspect "keep"), so a 1920x1080 window gives a 1440x1080 picture.
          if ($d.shots[0].width -ne 1440 -or $d.shots[0].height -ne 1080) { throw "unexpected size $($d.shots[0].width)x$($d.shots[0].height)" }
          # The same scene again barely changes; at another size the comparison says so; the baseline cannot be the output.
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 shot -Json -Project examples/csharp/game -Resolution 1920x1080 -Frames 30 -Output screenshots/after -Baseline screenshots 2>$null | ConvertFrom-Json
          $c = $d.shots[0].compare
          if (-not $d.ok -or $c.changedPercent -gt 5 -or $c.sizeChanged -or -not (Test-Path $c.image)) { throw "compare: $($d | ConvertTo-Json -Depth 5)" }
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 shot -Json -Project examples/csharp/game -Resolution 1280x720 -Frames 30 -Output screenshots/small -Baseline screenshots 2>$null | ConvertFrom-Json
          if (-not $d.ok -or -not $d.shots[0].compare.sizeChanged) { throw "size change: $($d | ConvertTo-Json -Depth 5)" }
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 shot -Json -Project examples/csharp/game -Output screenshots -Baseline screenshots 2>$null | ConvertFrom-Json
          if ($d.ok -or $d.error.code -ne 'invalid-arguments') { throw "-Baseline equal to -Output should be refused: $($d | ConvertTo-Json -Depth 5)" }
          exit 0
      - name: The textsize runner fails text under 9 px at 1280x800, and integer scaling that cuts off
        shell: pwsh
        run: ./tests/Test-TextSize.ps1
      - name: The kit runs from a folder with [ ] in its name
        shell: pwsh
        run: ./tests/Test-KitPaths.ps1
      - name: The layout runner catches screens that do not fit phones, tablets and ultrawides
        shell: pwsh
        run: ./tests/Test-Layout.ps1
      - name: deck runs text size, layout, a screenshot and bench at 1280x800 and gives one verdict
        shell: pwsh
        run: ./tests/Test-Deck.ps1
      - name: UI flows rotate the window with an action held, and name every bad resize, hold and release
        shell: pwsh
        run: ./tests/Test-Flows.ps1
      - name: soak runs a server and clients, and catches a leak and a crash
        shell: pwsh
        run: ./tests/Test-Soak.ps1
      - name: credits builds credits and notices from assets.json and refuses incomplete entries
        shell: pwsh
        run: ./tests/Test-Credits.ps1
      - name: shot -Locale -Pseudo finds cut-off, off-screen and missing-glyph text
        shell: pwsh
        run: |
          # A fresh checkout: the import also has to cope with translations listed before they are made.
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 shot -Json -Project tests/l10n-fixture/clean -Resolution 1920x1080 -Frames 5 -Locale fr -Pseudo -Output screenshots/l10n 2>$null | ConvertFrom-Json
          if ($d.ok -or $d.error.code -ne 'shot-text' -or $d.shots.Count -ne 3) { throw "expected shot-text with 3 shots: $($d | ConvertTo-Json -Depth 6)" }
          $by = @{}; foreach ($s in $d.shots) { $by["$($s.locale)"] = @($s.text | ForEach-Object { "$($_.problem):$($_.node)" }) }
          foreach ($pass in '', 'fr', 'pseudo') {
              foreach ($want in 'missing glyphs:Kanji', 'off screen:Edge') { if ($by[$pass] -notcontains $want) { throw "[$pass] should report $want, got: $($by[$pass] -join ', ')" } }
              if ($by[$pass] -match ':Title$') { throw "[$pass] the label that fits was reported" }
          }
          if ($by[''] -contains 'cut off:Play') { throw 'English "Hello" fits the button' }
          foreach ($pass in 'fr', 'pseudo') { if ($by[$pass] -notcontains 'cut off:Play') { throw "[$pass] the button text should be cut off, got: $($by[$pass] -join ', ')" } }
          exit 0
      - name: shot -ColorVision saves each screen as protanopes, deuteranopes and tritanopes see it
        shell: pwsh
        run: ./tests/Test-ColorVision.ps1
      - name: The mono option (StereoEnhance on Master) turns each side into (L+R)/2
        shell: pwsh
        run: ./tests/Test-MonoAudio.ps1
      - name: validate fails a .tres that keeps a renamed export's old key
        shell: pwsh
        run: ./tests/Test-StaleTres.ps1
      - name: shot -MaxChangedPercent fails a screen that changed against its baseline
        shell: pwsh
        run: ./tests/Test-ShotChanged.ps1
      - name: The palette check reads docs/STYLE.md and passes anti-aliased edges; shot -MaxOffPalettePercent fails a swatch not in its palette
        shell: pwsh
        run: ./tests/Test-Palette.ps1
      - name: The playthrough check wants every milestone in order; the runner passes a bot that finishes and fails one stuck in level 1
        shell: pwsh
        run: ./tests/Test-Playthrough.ps1
      - name: Capture mode hides the HUD, mutes only the music, and freezes the game while the free camera flies
        shell: pwsh
        run: ./tests/Test-Capture.ps1
      - uses: ./.github/actions/apt
        with:
          packages: ffmpeg
      - name: audio measures sound files and doctor names missing buses; -Mix records the game's mix and judges its loudness
        shell: pwsh
        run: ./tests/Test-Audio.ps1 -Mix
      - name: -GameArgs reach the game
        shell: pwsh
        run: |
          $game = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'args-game')
          Set-Content (Join-Path $game 'project.godot') "config_version=5`n[application]`nconfig/name=`"Args`"`nrun/main_scene=`"res://main.tscn`""
          Set-Content (Join-Path $game 'main.gd') "extends Node`nfunc _ready() -> void:`n`tif not `"--autoplay`" in OS.get_cmdline_user_args():`n`t`tpush_error(`"no --autoplay flag`")"
          Set-Content (Join-Path $game 'main.tscn') "[gd_scene load_steps=2 format=3]`n[ext_resource type=`"Script`" path=`"res://main.gd`" id=`"1`"]`n[node name=`"Main`" type=`"Node`"]`nscript = ExtResource(`"1`")"
          $ci = './ci/godot/hyperdot.ps1'
          $d = pwsh -NoProfile -File $ci test -Json -Project $game -Runners smoke -Results "$game/r1" -GameArgs '--seed=3,--autoplay' 2>$null | ConvertFrom-Json
          if (-not $d.ok) { throw "with the flag: $($d | ConvertTo-Json -Depth 6)" }
          $d = pwsh -NoProfile -File $ci test -Json -Project $game -Runners smoke -Results "$game/r2" 2>$null | ConvertFrom-Json
          if ($d.ok -or $d.error.code -ne 'tests-failed') { throw "without the flag the smoke run should fail: $($d | ConvertTo-Json -Depth 6)" }
          exit 0   # the last run failed on purpose; see the bench step
      - name: Every documented error code no other test raises is raised and reported
        shell: pwsh
        run: ./tests/Test-ErrorCodes.ps1
      - name: Keep what this job's kit runs reached
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-measure
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 14

  # The game benchmark's grading, against stand-ins for the model: the pilot programme and the staged one (a test
  # programme, and benchmark/game-programme.json's written genres). Its own job: it runs Godot for every task several
  # times, and the staged programme grows with each genre. The .NET build of Godot runs the GDScript games too.
  game-benchmark:
    needs: changes
    if: needs.changes.outputs.game-benchmark == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # Every kit run in this job records the functions it entered and the error code it stopped with; the coverage job
      # at the end adds them up (tests/Get-KitCoverage.ps1).
      - name: Record what the kit reaches
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'
      - name: Godot (.NET build), for GODOT_BIN
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 setup -Project examples/csharp/game
      - name: The game benchmark grades good and bad game work by the game's tests, and judges it
        shell: pwsh
        run: ./tests/Test-GameBenchmark.ps1
      # Nightly and on main only: the staged programme's own pairs (the game-programme jobs) check the same thing on the
      # real games, and the step above runs this programme through the runner; it has not failed in the sampled runs.
      - name: Every task of a test programme catches its defect, passes its reference and fails its decoy
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./tests/Test-GameProgramme.ps1 -SpecPath tests/game-benchmark/programme/programme.json
      # The runner has passwordless sudo, so this checks the sudo launcher with a real separate user.
      - name: Isolated sessions cannot read the benchmark or a hidden test, and are still graded
        shell: pwsh
        run: ./tests/Test-BenchmarkIsolation.ps1
      - name: Keep what this job's kit runs reached
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-game-benchmark
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 14

  # What this change needs, from .github/scripts/Select-Jobs.ps1 (held to its rules by tests/Test-SelectJobs.ps1): which of
  # the jobs below that can be skipped run, and which pairs of the staged programme. Everything runs on a push to main, on
  # the nightly schedule, when started by hand and when the base cannot be compared. On a pull request a job runs when the
  # files it exercises changed (or the shared core, or the workflow); a change to documentation alone runs lint alone.
  # The staged programme (benchmark/game-programme.json): every written genre's tasks must catch their defect, pass
  # their reference and fail their decoy. It runs Godot hundreds of times (the C# arcade game alone takes about an hour
  # and a half), so it runs one job per genre and language, and on a pull request only the pairs whose game changed; a
  # change to the check's own code (the harness, the programme, the templates) runs a sample of three pairs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      zero-config: ${{ steps.select.outputs.zero-config }}
      csharp: ${{ steps.select.outputs.csharp }}
      explicit-runners: ${{ steps.select.outputs.explicit-runners }}
      action: ${{ steps.select.outputs.action }}
      local-windows: ${{ steps.select.outputs.local-windows }}
      init: ${{ steps.select.outputs.init }}
      measure: ${{ steps.select.outputs.measure }}
      game-benchmark: ${{ steps.select.outputs.game-benchmark }}
      field-test: ${{ steps.select.outputs.field-test }}
      web: ${{ steps.select.outputs.web }}
      full: ${{ steps.select.outputs.full }}
      all: ${{ steps.select.outputs.all }}
      pairs: ${{ steps.select.outputs.pairs }}
      hash-lint: ${{ steps.hash.outputs.lint }}
      hit-lint: ${{ steps.lookup-lint.outputs.cache-hit }}
      hash-zero-config: ${{ steps.hash.outputs.zero-config }}
      hit-zero-config: ${{ steps.lookup-zero-config.outputs.cache-hit }}
      hash-csharp: ${{ steps.hash.outputs.csharp }}
      hit-csharp: ${{ steps.lookup-csharp.outputs.cache-hit }}
      hash-explicit-runners: ${{ steps.hash.outputs.explicit-runners }}
      hit-explicit-runners: ${{ steps.lookup-explicit-runners.outputs.cache-hit }}
      hash-action: ${{ steps.hash.outputs.action }}
      hit-action: ${{ steps.lookup-action.outputs.cache-hit }}
      hash-local-windows: ${{ steps.hash.outputs.local-windows }}
      hit-local-windows: ${{ steps.lookup-local-windows.outputs.cache-hit }}
      hash-init: ${{ steps.hash.outputs.init }}
      hit-init: ${{ steps.lookup-init.outputs.cache-hit }}
      hash-measure: ${{ steps.hash.outputs.measure }}
      hit-measure: ${{ steps.lookup-measure.outputs.cache-hit }}
      hash-game-benchmark: ${{ steps.hash.outputs.game-benchmark }}
      hit-game-benchmark: ${{ steps.lookup-game-benchmark.outputs.cache-hit }}
      hash-field-test: ${{ steps.hash.outputs.field-test }}
      hit-field-test: ${{ steps.lookup-field-test.outputs.cache-hit }}
      hash-web: ${{ steps.hash.outputs.web }}
      hit-web: ${{ steps.lookup-web.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
      - name: Which jobs and which genre and language pairs does this change need?
        id: select
        shell: pwsh
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./.github/scripts/Select-Jobs.ps1
      # Stage 0 of the cache in docs/ci-cache.md: each job's input hash, and whether a green marker for it was saved by an
      # earlier run (the `record` job below saves them). Nothing is skipped; the hit rate is only observed.
      - name: Input hash of each job (git object ids of the files it reads, the runner image, the event)
        id: hash
        shell: pwsh
        env:
          # The jobs that do not run on this ubuntu image get their runner label in the key instead of its image version.
          RUNNER_BY_JOB: '{"local-windows":"windows-latest","csharp":"ubuntu-latest+windows-latest+macos-latest"}'
        run: ./.github/scripts/Get-InputHash.ps1
      - id: lookup-lint
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-lint-${{ steps.hash.outputs.lint }}
          lookup-only: true
      - id: lookup-zero-config
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-zero-config-${{ steps.hash.outputs.zero-config }}
          lookup-only: true
      - id: lookup-csharp
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-csharp-${{ steps.hash.outputs.csharp }}
          lookup-only: true
      - id: lookup-explicit-runners
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-explicit-runners-${{ steps.hash.outputs.explicit-runners }}
          lookup-only: true
      - id: lookup-action
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-action-${{ steps.hash.outputs.action }}
          lookup-only: true
      - id: lookup-local-windows
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-local-windows-${{ steps.hash.outputs.local-windows }}
          lookup-only: true
      - id: lookup-init
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-init-${{ steps.hash.outputs.init }}
          lookup-only: true
      - id: lookup-measure
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-measure-${{ steps.hash.outputs.measure }}
          lookup-only: true
      - id: lookup-game-benchmark
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-game-benchmark-${{ steps.hash.outputs.game-benchmark }}
          lookup-only: true
      - id: lookup-field-test
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-field-test-${{ steps.hash.outputs.field-test }}
          lookup-only: true
      - id: lookup-web
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-web-${{ steps.hash.outputs.web }}
          lookup-only: true

  game-programme:
    needs: changes
    if: needs.changes.outputs.pairs != '[]'
    name: game-programme (${{ matrix.genre }}, ${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.pairs) }}
    steps:
      - uses: actions/checkout@v7
      - name: Godot (.NET build), for GODOT_BIN
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 setup -Project examples/csharp/game
      # From a folder of its own, as the check exports builds and writes beside where it runs.
      - name: Every ${{ matrix.genre }} task in ${{ matrix.language }} catches its defect, passes its reference and fails its decoy
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: '& "$env:GITHUB_WORKSPACE/tests/Test-GameProgramme.ps1" -Genre ${{ matrix.genre }} -Language ${{ matrix.language }}'

  # The private field test (-GameSource) with a stand-in for the model: the mutant planter, and whole runs on copies
  # of both examples, good and bad work, numbers only in the report.
  field-test:
    needs: changes
    if: needs.changes.outputs.field-test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Record what the kit reaches
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'
      - name: Godot (.NET build), for GODOT_BIN
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 setup -Project examples/csharp/game
      - name: The field test plants defects the game's checks find, grades the work and reports numbers only
        shell: pwsh
        run: ./tests/Test-FieldTest.ps1
      - name: Keep what this job's kit runs reached
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-field-test
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 14

  # Web exports opened in real browsers (export -Run -Browser): Playwright's Chromium and Firefox, and the runner's Edge.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Every kit run in this job records the functions it entered and the error code it stopped with; the coverage job
      # at the end adds them up (tests/Get-KitCoverage.ps1).
      - name: Record what the kit reaches
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'
      # Playwright's own --with-deps installs the browsers' system packages from Ubuntu's mirror, which took 11 of this
      # job's 15 minutes at 35 kB/s; the apt action keeps them in the Actions cache. The browsers come from Playwright's
      # CDN in seconds. xvfb and the Mesa drivers are for the Firefox step below; lavapipe (mesa-vulkan-drivers, a software
      # Vulkan) and the Khronos validation layer are for the GPU validation step.
      - name: The system packages Playwright's browsers need
        id: browser-packages
        shell: pwsh
        run: |
          # --dry-run simulates apt-get and lists what is missing on this image (it exits 1 when something is, so the
          # step ends with exit 0: GitHub's pwsh wrapper would take that code).
          $plan = npx --yes playwright@1.64.1 install-deps --dry-run chromium firefox 2>&1 | Out-String
          $header = [regex]::Match($plan, 'Missing system dependencies \(\d+\):\r?\n(?<list>(?:  \S+\r?\n?)+)')
          if ($header.Success) { $missing = @([regex]::Matches($header.Groups['list'].Value, '(?m)^  (\S+)') | ForEach-Object { $_.Groups[1].Value }) }
          elseif ($plan -match 'All system dependencies are installed') { $missing = @() }
          else { throw "Could not read Playwright's package list: $plan" }
          "packages=$($missing -join ' ') xvfb libgl1-mesa-dri mesa-vulkan-drivers vulkan-validationlayers" >> $env:GITHUB_OUTPUT
          exit 0
      - uses: ./.github/actions/apt
        with:
          packages: ${{ steps.browser-packages.outputs.packages }}
      - name: Playwright's Chromium and Firefox
        run: npx --yes playwright@1.64.1 install chromium firefox
      - name: export -Run starts web builds, serves threads builds isolated and catches script errors
        shell: pwsh
        run: ./tests/Test-Web.ps1 -Browser chromium,msedge
      # Headless Firefox on this runner reports WebGL 2 missing; with a window under Xvfb it renders in software.
      - name: Firefox with a window under Xvfb
        shell: pwsh
        env:
          HYPERDOT_WEB_HEADED: '1'
          DISPLAY: ':99'
        run: |
          Start-Process Xvfb -ArgumentList ':99', '-screen', '0', '1920x1080x24'
          Start-Sleep -Seconds 2
          ./tests/Test-Web.ps1 -Browser firefox
      # The export templates are on the runner now.
      - name: export -Json breaks the build size down by folder and kind of file, from the pack in or next to the executable
        shell: pwsh
        run: ./tests/Test-BuildSize.ps1
      # Here because the export templates are already installed; Vulkan is Mesa's lavapipe under Xvfb.
      - name: -GpuValidation catches a Vulkan misuse in bench, shot and export -Run, and refuses runs it cannot validate
        shell: pwsh
        env:
          DISPLAY: ':98'
        run: |
          Start-Process Xvfb -ArgumentList ':98', '-screen', '0', '1280x800x24'
          Start-Sleep -Seconds 2
          ./tests/Test-GpuValidation.ps1
      - name: Keep what this job's kit runs reached
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 14

  # The composite action inside a custom workflow.
  action:
    needs: changes
    if: needs.changes.outputs.action == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Every kit run in this job records the functions it entered and the error code it stopped with; the coverage job
      # at the end adds them up (tests/Get-KitCoverage.ps1).
      - name: Record what the kit reaches
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'
      - uses: ./.github/actions/godot
        with:
          command: build
          project: examples/csharp/game

      - name: Keep what this job's kit runs reached
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-action
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 14

  # The script on Windows, as on a developer machine: no workflow, no action.
  local-windows:
    needs: changes
    if: needs.changes.outputs.local-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Every kit run in this job records the functions it entered and the error code it stopped with; the coverage job
      # at the end adds them up (tests/Get-KitCoverage.ps1).
      - name: Record what the kit reaches
        shell: pwsh
        run: '"HYPERDOT_COVERAGE=$env:RUNNER_TEMP/hyperdot-coverage" >> $env:GITHUB_ENV'
      - name: GDScript example
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 test -Project examples/gdscript
      - name: C# example with coverage
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 test -Project examples/csharp/game -Coverage
      - name: Filtered run
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 test -Project examples/csharp/game -Runners dotnet -Filter 'FullyQualifiedName~RunState'
      - name: A hung program is stopped after the time limit
        shell: pwsh
        run: ./tests/Test-ProcessTimeout.ps1
      - name: A crashed import or export is repeated, a failure or a hang is not
        shell: pwsh
        run: ./tests/Test-CrashRetry.ps1
      - name: detect and doctor answer with one valid JSON document, and doctor passes
        shell: pwsh
        run: |
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 detect -Json -Project examples/csharp/game 2>$null | ConvertFrom-Json
          if ($d.schema -ne 'hyperdot/1' -or -not $d.ok -or $d.runners.Count -lt 3) { throw "unexpected detect output" }
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 doctor -Json -Project examples/csharp/game 2>$null | ConvertFrom-Json
          if (-not $d.ok -or $d.checks.Count -lt 1) { throw "unexpected doctor output" }
      - name: Plan
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'plan-test')
          git -C $dir init -q
          Copy-Item -Recurse examples/gdscript/* $dir
          ./ci/godot/hyperdot.ps1 plan -Do init -Project $dir
          if ($LASTEXITCODE) { throw "plan -Do init failed ($LASTEXITCODE)" }
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 plan -Json -Project $dir 2>$null | ConvertFrom-Json
          if ($d.currentPhase.id -ne 'concept' -or $d.nextActions.Count -lt 1) { throw "unexpected plan output" }
      - name: MCP config is written, kept on re-run, and merged into an existing file; -McpAseprite finds Aseprite.exe
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'mcp-test')
          git -C $dir init -q
          Copy-Item -Recurse examples/gdscript/* $dir
          '{"mcpServers":{"other":{"command":"x"}}}' | Set-Content (Join-Path $dir '.mcp.json')
          foreach ($run in 1, 2) {
              pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 init -Mcp godot-mcp -McpDiagnostics -Project $dir
              if ($LASTEXITCODE) { throw "init -Mcp run $run failed ($LASTEXITCODE)" }
          }
          $servers = (Get-Content (Join-Path $dir '.mcp.json') -Raw | ConvertFrom-Json).mcpServers.PSObject.Properties.Name
          if (($servers | Sort-Object) -join ',' -ne 'godot-mcp,minimal-godot-mcp,other') { throw "unexpected servers: $servers" }
          if (-not (Test-Path (Join-Path $dir '.mcp.json.bak'))) { throw 'no backup of the existing .mcp.json' }
          # -McpAseprite takes Aseprite's folder (a space in its name, as under Program Files) and refuses one without the program.
          $ase = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'Aseprite Test')
          New-Item -ItemType File (Join-Path $ase 'Aseprite.exe') | Out-Null
          pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 init -McpAseprite $ase -Project $dir
          if ($LASTEXITCODE) { throw "init -McpAseprite failed ($LASTEXITCODE)" }
          $entry = (Get-Content (Join-Path $dir '.mcp.json') -Raw | ConvertFrom-Json).mcpServers.aseprite
          if ($entry.command -ne 'uvx' -or $entry.env.ASEPRITE_PATH -ne (Join-Path $ase 'Aseprite.exe') -or $entry.args -notcontains 'aseprite_mcp') { throw "unexpected aseprite entry: $($entry | ConvertTo-Json -Compress)" }
          $d = pwsh -NoProfile -File ./ci/godot/hyperdot.ps1 init -McpAseprite (Join-Path $env:RUNNER_TEMP 'no-aseprite') -Project $dir -Json 2>$null | ConvertFrom-Json
          if ($d.ok -or $d.error.code -ne 'aseprite-not-found') { throw "expected aseprite-not-found, got: $($d.error.code)" }
          exit 0  # the last pwsh run failed on purpose; GitHub's shell would otherwise end the step with its exit code
      - name: Export the Windows build and launch it
        shell: pwsh
        run: ./ci/godot/hyperdot.ps1 export -Project examples/csharp/game -Preset Windows -Run
      - name: Keep what this job's kit runs reached
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-local-windows
          path: ${{ runner.temp }}/hyperdot-coverage
          if-no-files-found: ignore
          retention-days: 14

  # What the self-tests reach, from every job's records: commands, functions, documented error codes. A drop below the
  # floors fails the run, so coverage cannot fall unnoticed. The floors are for the whole suite: a pull request may skip
  # jobs (the change filter) and steps (kept for main and the nightly run), whose records are then missing by design, so
  # it only reports what was reached. Pushes to main, the nightly run and manual runs enforce the floors.
  coverage:
    needs: [changes, lint, zero-config, csharp, explicit-runners, init, measure, game-benchmark, field-test, web, action, local-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage
      - name: Coverage of the kit by the self-tests
        shell: pwsh
        env:
          # Pushes to main, the nightly run and manual runs skip no job and no step, so the floors hold; a pull request
          # may skip jobs and steps, whose records are then missing by design.
          WHOLE_SUITE: ${{ github.event_name != 'pull_request' }}
        run: |
          $whole = $env:WHOLE_SUITE -eq 'true'
          $floors = if ($whole) { @{ MinFunctions = 85; MinErrorCodes = 80; MinCommands = 100 } } else { @{} }
          if (-not $whole) { Write-Host '::notice::A pull request may skip jobs and steps, so coverage is reported but its floors are enforced only by pushes to main, the nightly run and manual runs' }
          try {
            ./tests/Get-KitCoverage.ps1 -From "$env:RUNNER_TEMP/coverage" -Json > "$env:RUNNER_TEMP/coverage.json"
            $report = ./tests/Get-KitCoverage.ps1 -From "$env:RUNNER_TEMP/coverage" @floors 6>&1
            $code = $LASTEXITCODE
          } catch {
            # Without records there is nothing to report; on the whole suite that is itself the failure.
            if ($whole) { throw }
            Write-Host "::warning::No coverage records to report: $($_.Exception.Message)"
            exit 0
          }
          $report | Out-String | Tee-Object -Variable text | Write-Host
          "``````text`n$text`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      # The coverage map from this run's records: which self-test reached what (each record names its test).
      - name: Coverage map
        if: always()
        shell: pwsh
        run: ./tests/Get-CoverageMap.ps1 -From "$env:RUNNER_TEMP/coverage" -Output "$env:RUNNER_TEMP/coverage.md"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kit-coverage
          path: |
            ${{ runner.temp }}/coverage.json
            ${{ runner.temp }}/coverage.md

  # Stage 0 of the cache (docs/ci-cache.md): records which jobs went green on which input hash, so a later run can tell it
  # would have found the result. A marker is a one-line Actions cache entry; it is saved only for a job that succeeded, only
  # when no marker for its hash existed, and never for a pull request from a fork. Nothing reads a marker to skip a job.
  # The observations of every job (hash, hit, selected, result) are kept for 14 days for the analysis of the two weeks.
  record:
    needs: [changes, lint, zero-config, csharp, explicit-runners, action, local-windows, init, measure, game-benchmark, field-test, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: What the hashes say about this run
        id: observe
        shell: pwsh
        env:
          NEEDS: ${{ toJSON(needs) }}
          MAY_WRITE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: ./.github/scripts/Write-CacheObservations.ps1
      - if: ${{ steps.observe.outputs.save-lint == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-lint-${{ needs.changes.outputs.hash-lint }}
      - if: ${{ steps.observe.outputs.save-zero-config == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-zero-config-${{ needs.changes.outputs.hash-zero-config }}
      - if: ${{ steps.observe.outputs.save-csharp == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-csharp-${{ needs.changes.outputs.hash-csharp }}
      - if: ${{ steps.observe.outputs.save-explicit-runners == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-explicit-runners-${{ needs.changes.outputs.hash-explicit-runners }}
      - if: ${{ steps.observe.outputs.save-action == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-action-${{ needs.changes.outputs.hash-action }}
      - if: ${{ steps.observe.outputs.save-local-windows == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-local-windows-${{ needs.changes.outputs.hash-local-windows }}
      - if: ${{ steps.observe.outputs.save-init == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-init-${{ needs.changes.outputs.hash-init }}
      - if: ${{ steps.observe.outputs.save-measure == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-measure-${{ needs.changes.outputs.hash-measure }}
      - if: ${{ steps.observe.outputs.save-game-benchmark == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-game-benchmark-${{ needs.changes.outputs.hash-game-benchmark }}
      - if: ${{ steps.observe.outputs.save-field-test == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-field-test-${{ needs.changes.outputs.hash-field-test }}
      - if: ${{ steps.observe.outputs.save-web == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ci-marker
          key: ci-job-web-${{ needs.changes.outputs.hash-web }}
      - uses: actions/upload-artifact@v7
        with:
          name: cache-observations
          path: ${{ runner.temp }}/cache-observations.jsonl
          retention-days: 14
