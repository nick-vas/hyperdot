# Tags a release and publishes it: `v<version>` (annotated, never moved) and the major tag `v<major>` (moved on purpose),
# then a GitHub release with the changelog section as its notes. Run by hand: Actions > Release > Run workflow
# (docs/ci.md). It exists because tags cannot be pushed from the cloud session (its git proxy answers 403 for tag pushes).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (for example 0.1.0). CHANGELOG.md needs a "## <version> - " section and .claude-plugin/plugin.json the same version.'
        required: true
        type: string
      sha:
        description: 'Commit to tag. Empty: the head of the branch this run is dispatched on. Must be on main and have a successful Self-test push run.'
        required: false
        type: string
      major_tag:
        description: 'The moving tag, for example v1. Empty: v<major of the version> (v0 for 0.x). Games pin @v1, so releases of 0.x name v1 here.'
        required: false
        type: string

permissions:
  contents: write
  actions: read   # to find the commit's successful Self-test run

# One release at a time; never cancel one halfway through its tags.
concurrency:
  group: release
  cancel-in-progress: false

# git 2.54+ background maintenance: off, as in self-test.yml.
env:
  GIT_CONFIG_COUNT: '3'
  GIT_CONFIG_KEY_0: gc.auto
  GIT_CONFIG_VALUE_0: '0'
  GIT_CONFIG_KEY_1: gc.autoDetach
  GIT_CONFIG_VALUE_1: 'false'
  GIT_CONFIG_KEY_2: maintenance.auto
  GIT_CONFIG_VALUE_2: 'false'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The workflow's own commit (the tip of main) is checked out, so the scripts below exist even when the commit to release
      # is older than they are; the files of the commit to release are read with `git show`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: The commit is on main and its Self-test push run succeeded
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SHA_INPUT: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          function Invoke-Native([string]$What, [scriptblock]$Command) {
            $out = & $Command
            if ($LASTEXITCODE -ne 0) { throw "$What failed (exit code $LASTEXITCODE)" }
            return $out
          }
          if ($env:VERSION -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z') { throw "version '$env:VERSION' is not <major>.<minor>.<patch>" }
          $target = if ($env:SHA_INPUT) { $env:SHA_INPUT } else { 'HEAD' }
          $sha = (Invoke-Native 'git rev-parse' { git rev-parse "$target^{commit}" }).Trim()
          Invoke-Native 'git fetch origin main' { git fetch --quiet origin main }
          git merge-base --is-ancestor "$sha" origin/main
          if ($LASTEXITCODE -ne 0) { throw "$sha is not reachable from origin/main: only commits on main are released" }
          # Needs read access to workflow runs: the default for a public repository. A private one needs `actions: read`
          # in this workflow's permissions; the check then fails closed rather than releasing an untested commit.
          $runs = Invoke-Native 'gh api (Self-test runs)' { gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/self-test.yml/runs?head_sha=$sha&event=push&status=success&per_page=1" --jq '.total_count' }
          if ([int]$runs -lt 1) { throw "$sha has no successful Self-test run for a push to main. Wait for it, or release a commit that has one." }
          Write-Host "$sha is on main and passed Self-test"
          "RELEASE_SHA=$sha" >> $env:GITHUB_ENV
      - name: The changelog has a section for the version, and the plugin has that version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          # The changelog and the plugin manifest as they are at the commit to release.
          $changelog = Join-Path $env:RUNNER_TEMP 'CHANGELOG.md'
          $content = git show "$($env:RELEASE_SHA):CHANGELOG.md"
          if ($LASTEXITCODE -ne 0) { throw "git show $env:RELEASE_SHA:CHANGELOG.md failed (exit code $LASTEXITCODE)" }
          Set-Content -LiteralPath $changelog -Encoding utf8 -Value $content
          # Stops when CHANGELOG.md has no "## <version> - " section or it is empty.
          ./.github/scripts/Get-ChangelogSection.ps1 -Version $env:VERSION -Changelog $changelog | Set-Content -LiteralPath $notes -Encoding utf8
          # A release body holds at most 125000 characters; the 0.1.0 section is longer, so the notes are cut at a line and point
          # to the changelog.
          $body = Get-Content -Raw -LiteralPath $notes
          if ($body.Length -gt 120000) {
            $cut = $body.Substring(0, 120000)
            $cut = $cut.Substring(0, $cut.LastIndexOf("`n"))
            $link = "https://github.com/$env:GITHUB_REPOSITORY/blob/v$env:VERSION/CHANGELOG.md"
            Set-Content -LiteralPath $notes -Encoding utf8 -Value "$cut`n`n(Cut here: the whole section is in [CHANGELOG.md]($link).)"
          }
          $manifest = git show "$($env:RELEASE_SHA):.claude-plugin/plugin.json"
          if ($LASTEXITCODE -ne 0) { throw "git show $env:RELEASE_SHA:.claude-plugin/plugin.json failed (exit code $LASTEXITCODE)" }
          $plugin = ($manifest | Out-String | ConvertFrom-Json).version
          if ($plugin -ne $env:VERSION) { throw ".claude-plugin/plugin.json has version $plugin, not $env:VERSION" }
          "NOTES_FILE=$notes" >> $env:GITHUB_ENV
      - name: Tag the version and move the major tag
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          MAJOR_INPUT: ${{ inputs.major_tag }}
        run: |
          function Invoke-Native([string]$What, [scriptblock]$Command) {
            & $Command
            if ($LASTEXITCODE -ne 0) { throw "$What failed (exit code $LASTEXITCODE)" }
          }
          $tag = "v$env:VERSION"
          $major = if ($env:MAJOR_INPUT) { $env:MAJOR_INPUT } else { "v$(($env:VERSION -split '\.')[0])" }
          if ($major -notmatch '\Av[0-9]+\z') { throw "major_tag '$major' is not v<number>" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A version tag is never moved: refuse if it exists on the remote at another commit. One that already points at this
          # commit is left alone, so a run can be repeated to move the major tag.
          $remote = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'git ls-remote failed' }
          if ($remote.Count -gt 0) {
            $peeled = ($remote | Select-Object -Last 1) -split '\s+' | Select-Object -First 1
            if ($peeled -ne $env:RELEASE_SHA) { throw "Tag $tag already exists at $peeled, not $env:RELEASE_SHA; tags are never moved except $major" }
            Write-Host "Tag $tag already points at $env:RELEASE_SHA; left as it is"
          } else {
            Invoke-Native 'git tag' { git tag -a "$tag" "$env:RELEASE_SHA" -m "Hyperdot $env:VERSION" }
            Invoke-Native 'git push (version tag)' { git push origin "refs/tags/$tag" }
          }
          # The major tag (v1) is the only tag that moves: games pin `@v1` and follow it to each new release. -f replaces it
          # here and --force on the push moves it on the remote. Not backwards: releasing 1.2.1 after 1.3.0 leaves v1 where it is.
          $existing = @(git ls-remote --tags --refs origin 'refs/tags/v*') | ForEach-Object { ($_ -split '\s+')[1] -replace '^refs/tags/', '' }
          if ($LASTEXITCODE -ne 0) { throw 'git ls-remote (version tags) failed' }
          $decision = ./.github/scripts/Test-MajorTagMove.ps1 -Version $env:VERSION -Tags @($existing) | ConvertFrom-Json
          if (-not $decision.move) {
            Write-Host "::notice::$major stays where it is: $($decision.reason)"
          } else {
            Invoke-Native 'git tag (major)' { git tag -f -a "$major" "$env:RELEASE_SHA" -m "Hyperdot $major, now at $env:VERSION" }
            Invoke-Native 'git push (major tag)' { git push --force origin "refs/tags/$major" }
          }
      - name: GitHub release
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release v$env:VERSION exists; left as it is"; exit 0 }
          gh release create "v$env:VERSION" --verify-tag --title "Hyperdot $env:VERSION" --notes-file "$env:NOTES_FILE"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit code $LASTEXITCODE)" }
