# Weekly check against new releases: Godot (through Godot.NET.Sdk), the test-framework packages, GUT, and the aseprite-mcp
# commit and MCP SDK that init -McpAseprite pins; and the add-ons doctor warns about (ci/godot/addons-status.json). Each update is tried on both example projects (aseprite-mcp's by
# starting the server through uvx); the ones that pass become one pull request, the ones that fail an issue each, so the
# pinned versions on main never break because something upstream moved.
#
# Fridays 18:47 UTC (21:47 in Athens in summer, 20:47 in winter), ready for the weekly review.
# Pull requests opened with the default GITHUB_TOKEN do not start other workflows; add a CANARY_TOKEN secret (a token
# with contents and pull-requests write) to have Self-test run on them too. Settings > Actions > General must allow
# GitHub Actions to create pull requests.
name: Canary

on:
  schedule:
    - cron: '47 18 * * 5'
  workflow_dispatch:

# No write permission at workflow level: the job that runs upstream code (`try`) has read access only, no token in its
# environment and no credentials left in its checkout. `propose`, which has the write permissions and the token, runs none of
# that code: it applies the patch `try` made and opens the pull request and the issues.
permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # uvx starts aseprite-mcp with new pins, as init -McpAseprite's .mcp.json entry does.
      - name: Install uv
        run: pipx install uv==0.13.6
      - name: Try the newest releases on both examples
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'canary'
          New-Item -ItemType Directory -Force $out | Out-Null
          ./ci/godot/tools/Invoke-Canary.ps1 | Set-Content (Join-Path $out 'canary.json')
          Get-Content (Join-Path $out 'canary.json')
      # What the passing updates changed in the tree, for the job that proposes it. A shell redirect, not a pwsh pipeline,
      # which would rewrite line endings inside the patch.
      - name: Patch of the passing updates
        shell: bash
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/canary/canary.patch"
      - uses: actions/upload-artifact@v7
        with:
          name: canary
          path: ${{ runner.temp }}/canary
          retention-days: 7

  propose:
    needs: try
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.CANARY_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CANARY_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: canary
          path: ${{ runner.temp }}/canary
      - name: Pull request for what passed, issues for what did not
        shell: pwsh
        run: |
          $c = Get-Content (Join-Path $env:RUNNER_TEMP 'canary/canary.json') -Raw | ConvertFrom-Json
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $summary = @('### Canary', '', '| Update | Result |', '|---|---|')
          $summary += @($c.passing | ForEach-Object { "| $($_.name) $($_.current) -> $($_.latest) | passes both examples |" })
          $summary += @($c.failing | ForEach-Object { "| $($_.name) $($_.current) -> $($_.latest) | fails |" })
          $summary += @($c.blocked | ForEach-Object { "| $_ | blocked |" })
          if (-not ($c.passing -or $c.failing -or $c.blocked)) { $summary += '| everything | already on the newest stable release |' }
          $summary += @($c.addons.updates | ForEach-Object { "| add-on $($_.id) $($_.field) | $($_.old) -> $($_.new) |" })
          $summary += @($c.addons.review | ForEach-Object { "| add-on $($_.id) | needs a look |" })
          $summary += @(@($c.notes) + @($c.addons.notes) | ForEach-Object { '', "Note: $_" })
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY

          # The add-on status list (ci/godot/addons-status.json) rides along with the version updates.
          if ($c.passing -or $c.addons.updates) {
            $names = @($c.passing | ForEach-Object { "$($_.name) $($_.latest)" }) + @(if ($c.addons.updates) { 'add-on status' })
            $title = 'Canary: ' + ($names -join ', ')
            $open = @(gh pr list --state open --search 'Canary: in:title' --json title | ConvertFrom-Json | Where-Object title -eq $title)
            if ($open) {
              Write-Host "An open pull request already proposes: $title"
            } else {
              $branch = "feature/canary-$env:GITHUB_RUN_ID"
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git switch -c $branch
              # What the passing updates changed (made by the `try` job, which ran the upstream code).
              $patch = Join-Path $env:RUNNER_TEMP 'canary/canary.patch'
              git apply --index $patch
              if ($LASTEXITCODE -ne 0) { throw 'git apply of the canary patch failed' }
              git commit -m $title
              git push -u origin $branch
              $body = @('Newer releases that pass both example projects (`examples/gdscript`, `examples/csharp/game`) and the skill validator:', '')
              $body += @($c.passing | ForEach-Object { "- $($_.name): $($_.current) -> $($_.latest)" })
              $body += @($c.addons.updates | ForEach-Object { "- add-on $($_.id) $($_.field): $($_.old) -> $($_.new) (ci/godot/addons-status.json)" })
              $body += '', "Files: $(@($c.changed) -join ', ')", '', "Canary run: $run"
              if ($c.failing) { $body += '', 'Not included (see the canary issues):'; $body += @($c.failing | ForEach-Object { "- $($_.name) $($_.latest)" }) }
              gh pr create --base main --head $branch --title $title --body ($body -join "`n")
            }
          }

          $addonReview = @($c.addons.review | ForEach-Object { [pscustomobject]@{ name = "add-on $($_.id) needs a look"; latest = ''; current = ''; problem = $_.message } })
          foreach ($f in @($c.failing) + @($c.blocked | ForEach-Object { [pscustomobject]@{ name = $_; latest = ''; current = ''; problem = $_ } }) + $addonReview) {
            $title = if ($f.latest) { "Canary: $($f.name) $($f.latest) does not pass" } else { "Canary: $($f.name)" }
            $existing = @(gh issue list --state open --search "$title in:title" --json number,title | ConvertFrom-Json | Where-Object title -eq $title)
            $text = "$(if ($f.current) { "$($f.name) $($f.current) -> $($f.latest)`n`n" })``````text`n$($f.problem)`n```````n`nCanary run: $run"
            if ($existing) { gh issue comment $existing[0].number --body "Still failing.`n`n$text" }
            else { gh issue create --title $title --body $text }
          }
